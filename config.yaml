package: hubspot
generate:
  client: true
  models: true
output: client.gen.go
output-options:
  resolve-type-name-collisions: true
  # Counts, amounts and IDs are often plain `type: number` without a format,
  # which oapi-codegen maps to float32 by default. float32 loses precision, so
  # map them to float64.
  type-mapping:
    number:
      default:
        type: float64
compatibility:
  always-prefix-enum-values: true
